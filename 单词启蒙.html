<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>开心学单词</title>
<style>
:root {
  --bg1: #FFF9F0;
  --bg2: #F0F8FF;
  --card: #FFFFFF;
  --green: #7FD1A8;
  --greenDark: #5CBF8E;
  --orange: #FFB86C;
  --orangeDark: #F59F45;
  --blue: #8FC7EE;
  --blueDark: #6BAEDB;
  --pink: #FFB8C6;
  --purple: #C7B3E5;
  --text: #4A4A4A;
  --textLight: #8A8A8A;
  --shadow: 0 6px 20px rgba(0,0,0,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
  min-height: 100vh;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

body { padding-bottom: 30px; }

.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px;
}

/* 顶部标题 */
.header {
  text-align: center;
  padding: 16px 0 8px;
}
.header h1 {
  font-size: 30px;
  color: var(--orangeDark);
  letter-spacing: 2px;
  text-shadow: 1px 2px 0 #fff;
}
.header .subtitle {
  font-size: 14px;
  color: var(--textLight);
  margin-top: 4px;
}

/* 隐藏配置区的点击区域（右上角小齿轮） */
.config-trigger {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  box-shadow: var(--shadow);
  border: none;
  font-size: 20px;
  cursor: pointer;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--textLight);
  transition: transform 0.2s;
}
.config-trigger:active { transform: scale(0.9); }

/* 微信内提示 */
.wechat-tip {
  background: #FFF3E6;
  border: 2px solid #FFD9A8;
  border-radius: 16px;
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--orangeDark);
  line-height: 1.6;
  display: flex;
  align-items: center;
  gap: 10px;
}
.wechat-tip button {
  border: none;
  background: rgba(255,255,255,0.75);
  border-radius: 50%;
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  cursor: pointer;
  color: var(--orangeDark);
  font-size: 14px;
}

/* 卡片 */
.card {
  background: var(--card);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 16px;
}

/* 底部导航 */
.bottom-nav {
  display: flex;
  justify-content: space-around;
  background: var(--card);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 10px 6px;
  position: sticky;
  bottom: 12px;
  z-index: 40;
}
.nav-btn {
  flex: 1;
  border: none;
  background: transparent;
  border-radius: 18px;
  padding: 10px 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: var(--textLight);
  font-size: 12px;
  font-weight: bold;
  transition: background 0.2s, color 0.2s, transform 0.1s;
}
.nav-btn .icon { font-size: 24px; line-height: 1; }
.nav-btn:active { transform: scale(0.92); }
.nav-btn.active {
  background: #FFF3E6;
  color: var(--orangeDark);
}

/* 学习卡片 */
.word-card {
  text-align: center;
  min-height: 340px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.word-emoji {
  font-size: 80px;
  line-height: 1;
  margin-bottom: 12px;
  cursor: pointer;
}
.word-english {
  font-size: 52px;
  font-weight: bold;
  color: var(--blueDark);
  letter-spacing: 1px;
  cursor: pointer;
  word-break: break-word;
}
.word-chinese {
  font-size: 28px;
  color: var(--text);
  margin-top: 10px;
  cursor: pointer;
}
.speaker-hint {
  font-size: 14px;
  color: var(--textLight);
  margin-top: 16px;
}
.speaker-hint .sound-icon { font-size: 18px; }

.progress-text {
  text-align: center;
  font-size: 15px;
  color: var(--textLight);
  margin: 8px 0 14px;
}
.progress-bar {
  height: 14px;
  background: #F0F0F0;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 20px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--greenDark));
  border-radius: 10px;
  transition: width 0.4s;
  width: 0%;
}

/* 大按钮 */
.btn {
  border: none;
  border-radius: 18px;
  padding: 16px 20px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.1s, box-shadow 0.1s;
  width: 100%;
  font-family: inherit;
}
.btn:active { transform: scale(0.96); }
.btn-green {
  background: var(--green);
  color: #fff;
  box-shadow: 0 5px 0 var(--greenDark);
}
.btn-green:active { box-shadow: 0 2px 0 var(--greenDark); transform: translateY(3px) scale(0.98); }
.btn-orange {
  background: var(--orange);
  color: #fff;
  box-shadow: 0 5px 0 var(--orangeDark);
}
.btn-orange:active { box-shadow: 0 2px 0 var(--orangeDark); transform: translateY(3px) scale(0.98); }
.btn-blue {
  background: var(--blue);
  color: #fff;
  box-shadow: 0 5px 0 var(--blueDark);
}
.btn-blue:active { box-shadow: 0 2px 0 var(--blueDark); transform: translateY(3px) scale(0.98); }
.btn-gray {
  background: #F0F0F0;
  color: var(--text);
}
.btn-row {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}
.btn-row .btn { flex: 1; }

/* 状态标签 */
.status-badge {
  display: inline-block;
  font-size: 13px;
  padding: 5px 12px;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 12px;
}
.status-mastered { background: #E6F7EF; color: var(--greenDark); }
.status-review { background: #FFF0E6; color: var(--orangeDark); }

/* 打卡区域 */
.checkin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.checkin-title { font-size: 22px; font-weight: bold; }
.checkin-count {
  background: #FFF3E6;
  color: var(--orangeDark);
  padding: 6px 14px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: bold;
}
.stats-row {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
}
.stat-box {
  flex: 1;
  background: #F8FBFF;
  border-radius: 16px;
  padding: 14px 8px;
  text-align: center;
}
.stat-num { font-size: 28px; font-weight: bold; color: var(--blueDark); }
.stat-label { font-size: 12px; color: var(--textLight); margin-top: 2px; }

/* 日历 */
.calendar { margin-top: 8px; }
.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 12px;
  color: var(--textLight);
  margin-bottom: 8px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.calendar-day {
  aspect-ratio: 1;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  background: #F7F7F7;
  color: var(--text);
  position: relative;
}
.calendar-day.empty { background: transparent; }
.calendar-day.checked { background: #E6F7EF; color: var(--greenDark); font-weight: bold; }
.calendar-day.today { border: 2px solid var(--orange); }
.calendar-day .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  margin-top: 2px;
}

/* 单词本列表切换 */
.list-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
.list-tabs button {
  flex: 1; border: none; padding: 12px 8px; border-radius: 14px;
  font-size: 15px; font-weight: bold; cursor: pointer;
  background: #F0F0F0; color: var(--textLight); font-family: inherit;
}
.list-tabs button.active { background: #FFF3E6; color: var(--orangeDark); }
.list-tabs button.active.mastered { background: #E6F7EF; color: var(--greenDark); }

/* 复习列表 */
.review-item {
  display: flex;
  align-items: center;
  padding: 14px 12px;
  border-radius: 16px;
  background: #F8FBFF;
  margin-bottom: 10px;
  cursor: pointer;
}
.review-item:active { background: #EAF3FA; }
.review-emoji { font-size: 36px; margin-right: 14px; }
.review-info { flex: 1; }
.review-en { font-size: 22px; font-weight: bold; color: var(--blueDark); }
.review-cn { font-size: 15px; color: var(--textLight); margin-top: 2px; }
.review-play { font-size: 22px; }

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--textLight);
}
.empty-state .big-icon { font-size: 60px; margin-bottom: 12px; }
.empty-state p { font-size: 16px; line-height: 1.6; }

/* 弹窗 */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.45);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 24px;
  width: 100%;
  max-width: 440px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 22px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
.modal h2 { font-size: 22px; margin-bottom: 14px; text-align: center; }
.modal-close {
  float: right;
  border: none;
  background: #F0F0F0;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  color: var(--textLight);
}
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 14px; color: var(--textLight); margin-bottom: 6px; font-weight: bold; }
.form-group input, .form-group textarea {
  width: 100%;
  border: 2px solid #E8E8E8;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
  font-family: inherit;
  color: var(--text);
  outline: none;
}
.form-group input:focus, .form-group textarea:focus { border-color: var(--blue); }
.form-group textarea { min-height: 260px; resize: vertical; font-family: monospace; font-size: 13px; line-height: 1.5; }
.form-hint { font-size: 12px; color: var(--textLight); margin-top: 6px; line-height: 1.5; }
.word-list-edit { max-height: 320px; overflow-y: auto; margin-bottom: 14px; }
.edit-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid #F0F0F0;
}
.edit-row input {
  border: 1px solid #E0E0E0;
  border-radius: 8px;
  padding: 8px;
  font-size: 14px;
  font-family: inherit;
  min-width: 0;
}
.edit-row input.emoji-in { width: 54px; text-align: center; font-size: 22px; }
.edit-row input.en-in { flex: 1.2; }
.edit-row input.cn-in { flex: 1; }
.edit-row button {
  border: none;
  background: #FFE8E8;
  color: #E66;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
}
.tab-switch { display: flex; gap: 8px; margin-bottom: 14px; }
.tab-switch button {
  flex: 1;
  border: none;
  padding: 10px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  background: #F0F0F0;
  color: var(--textLight);
  font-family: inherit;
}
.tab-switch button.active { background: #FFF3E6; color: var(--orangeDark); }
.hidden { display: none !important; }

/* 提示消息 */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(74,74,74,0.92);
  color: #fff;
  padding: 16px 28px;
  border-radius: 16px;
  font-size: 18px;
  font-weight: bold;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* 庆祝彩纸 */
.confetti {
  position: fixed;
  top: -20px;
  width: 10px;
  height: 16px;
  z-index: 150;
  pointer-events: none;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* 关于提示 */
.notice {
  font-size: 12px;
  color: var(--textLight);
  text-align: center;
  line-height: 1.6;
  padding: 0 10px 10px;
}

/* 打卡按钮完成态 */
.checked-in { background: #E6F7EF !important; color: var(--greenDark) !important; box-shadow: none !important; }
</style>
</head>
<body>

<button class="config-trigger" onclick="openConfig()" title="设置">⚙️</button>
<div class="container">
  <div class="header">
    <h1>🌟 开心学单词</h1>
    <div class="subtitle">小朋友，一起快乐学英语吧！</div>
  </div>

  <div id="wechatTip" class="wechat-tip hidden">
    <span>🔇 微信里发音可能没声音，点右上角「…」→ <b>在浏览器中打开</b>，发音更稳定</span>
    <button onclick="this.parentNode.classList.add('hidden')" aria-label="关闭提示">✕</button>
  </div>

  <!-- 学习页面 -->
  <div id="page-learn" class="page">
    <div class="card">
      <div class="progress-text" id="progressText">第 1 / 10 个</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="word-card" id="wordCard">
        <div class="word-emoji" id="wordEmoji" onclick="speakEnglish()">🍎</div>
        <div class="word-english" id="wordEnglish" onclick="speakEnglish()">apple</div>
        <div class="word-chinese" id="wordChinese" onclick="speakChinese()">苹果</div>
        <div class="speaker-hint"><span class="sound-icon">🔊</span> 点一点，听发音</div>
        <div id="statusBadge"></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-orange" onclick="markWord(false)">🤔 还不会</button>
      <button class="btn btn-green" onclick="markWord(true)">✅ 学会了</button>
    </div>
  </div>

  <!-- 打卡页面 -->
  <div id="page-checkin" class="page hidden">
    <div class="card">
      <div class="checkin-header">
        <div class="checkin-title">📅 我的打卡</div>
        <div class="checkin-count" id="todayCount">今天 0 个</div>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-num" id="statMastered">0</div>
          <div class="stat-label">已掌握</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statReview">0</div>
          <div class="stat-label">还不会</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statStreak">0</div>
          <div class="stat-label">连续天数</div>
        </div>
      </div>
      <button class="btn btn-orange" id="checkinBtn" onclick="doCheckin()">🎯 今日打卡</button>
      <div class="calendar">
        <div class="calendar-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </div>
    <div class="notice">💡 每天学一个单词，也可以打卡哦！</div>
  </div>

  <!-- 单词本页面（复习 + 已掌握列表） -->
  <div id="page-review" class="page hidden">
    <div class="card">
      <div class="checkin-header">
        <div class="checkin-title">📋 我的单词本</div>
        <div class="checkin-count" id="reviewCount">0 个</div>
      </div>
      <div class="list-tabs">
        <button id="tabReview" class="active" onclick="switchReviewTab('review')">🔄 还不会</button>
        <button id="tabMastered" class="mastered" onclick="switchReviewTab('mastered')">✅ 已学会</button>
      </div>
      <div id="reviewList"></div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <button class="nav-btn active" data-page="learn" onclick="switchPage('learn')">
      <span class="icon">📖</span><span>学习</span>
    </button>
    <button class="nav-btn" data-page="review" onclick="switchPage('review')">
      <span class="icon">📋</span><span>单词本</span>
    </button>
    <button class="nav-btn" data-page="checkin" onclick="switchPage('checkin')">
      <span class="icon">📅</span><span>打卡</span>
    </button>
  </div>

  <div class="notice" style="margin-top:16px">
    ⚠️ 学习记录保存在本机浏览器，清除缓存或换设备会消失。
  </div>
</div>

<!-- 配置弹窗 -->
<div class="modal-overlay" id="configModal">
  <div class="modal">
    <button class="modal-close" onclick="closeConfig()">✕</button>
    <h2>⚙️ 单词管理</h2>
    <div class="tab-switch">
      <button id="tabSimple" class="active" onclick="switchTab('simple')">简单编辑</button>
      <button id="tabJson" onclick="switchTab('json')">批量导入</button>
    </div>

    <!-- 简单编辑 -->
    <div id="configSimple">
      <div class="word-list-edit" id="wordListEdit"></div>
      <button class="btn btn-blue" onclick="addWordRow()" style="margin-bottom:14px;font-size:16px;padding:12px">➕ 添加一个单词</button>
      <button class="btn btn-green" onclick="saveSimpleConfig()">💾 保存单词表</button>
    </div>

    <!-- 批量导入 -->
    <div id="configJson" class="hidden">
      <div class="form-group">
        <label>每行一个单词，格式：emoji|英文|中文</label>
        <textarea id="jsonText" spellcheck="false"></textarea>
        <div class="form-hint">例如：🍎|apple|苹果<br>修改后点保存，会覆盖当前单词表。</div>
      </div>
      <button class="btn btn-green" onclick="saveJsonConfig()">💾 保存单词表</button>
    </div>

    <div class="form-hint" style="margin-top:14px;text-align:center">
      长按右上角⚙️可进入此设置。修改单词后，旧的掌握记录会按英文单词保留。
    </div>
    <button class="btn btn-gray" onclick="resetAllData()" style="margin-top:10px;font-size:14px;padding:10px">🗑️ 清空所有学习记录</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 默认单词库 ====================
var DEFAULT_WORDS = [
  { emoji: '🍎', en: 'apple', cn: '苹果' },
  { emoji: '🍌', en: 'banana', cn: '香蕉' },
  { emoji: '🍇', en: 'grape', cn: '葡萄' },
  { emoji: '🍊', en: 'orange', cn: '橙子' },
  { emoji: '🍓', en: 'strawberry', cn: '草莓' },
  { emoji: '🐱', en: 'cat', cn: '猫' },
  { emoji: '🐶', en: 'dog', cn: '狗' },
  { emoji: '🐰', en: 'rabbit', cn: '兔子' },
  { emoji: '🐼', en: 'panda', cn: '熊猫' },
  { emoji: '🐟', en: 'fish', cn: '鱼' },
  { emoji: '🌞', en: 'sun', cn: '太阳' },
  { emoji: '🌙', en: 'moon', cn: '月亮' },
  { emoji: '⭐', en: 'star', cn: '星星' },
  { emoji: '🌳', en: 'tree', cn: '树' },
  { emoji: '🌸', en: 'flower', cn: '花' },
  { emoji: '🏠', en: 'house', cn: '房子' },
  { emoji: '🚗', en: 'car', cn: '汽车' },
  { emoji: '✏️', en: 'pencil', cn: '铅笔' },
  { emoji: '📖', en: 'book', cn: '书' },
  { emoji: '🎈', en: 'balloon', cn: '气球' }
];

// ==================== 本地存储 ====================
var STORAGE_KEY = 'happyWordsData_v1';

function loadData() {
  var data = null;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) {}
  if (!data || typeof data !== 'object') {
    data = { words: null, status: {}, daily: {} };
  }
  if (!data.words || !Array.isArray(data.words) || data.words.length === 0) {
    data.words = JSON.parse(JSON.stringify(DEFAULT_WORDS));
  }
  if (!data.status || typeof data.status !== 'object') data.status = {};
  if (!data.daily || typeof data.daily !== 'object') data.daily = {};
  return data;
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    showToast('存储空间不足');
  }
}

var data = loadData();

// ==================== 学习状态 ====================
var currentIndex = 0;
var order = [];

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function initLearn() {
  order = shuffle(data.words.map(function(_, i) { return i; }));
  currentIndex = 0;
  showWord();
}

function showWord() {
  if (order.length === 0) {
    document.getElementById('wordEnglish').textContent = '没有单词';
    document.getElementById('wordChinese').textContent = '请到设置里添加';
    document.getElementById('progressText').textContent = '';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('statusBadge').innerHTML = '';
    return;
  }
  var idx = order[currentIndex];
  var w = data.words[idx];
  document.getElementById('wordEmoji').textContent = w.emoji || '📝';
  document.getElementById('wordEnglish').textContent = w.en;
  document.getElementById('wordChinese').textContent = w.cn;
  document.getElementById('progressText').textContent = '第 ' + (currentIndex + 1) + ' / ' + order.length + ' 个';
  document.getElementById('progressFill').style.width = ((currentIndex + 1) / order.length * 100) + '%';

  var st = data.status[w.en];
  var badge = document.getElementById('statusBadge');
  if (st === 'mastered') {
    badge.innerHTML = '<span class="status-badge status-mastered">✅ 已掌握</span>';
  } else if (st === 'review') {
    badge.innerHTML = '<span class="status-badge status-review">🔄 待复习</span>';
  } else {
    badge.innerHTML = '';
  }
}

function markWord(known) {
  if (order.length === 0) return;
  var idx = order[currentIndex];
  var w = data.words[idx];
  data.status[w.en] = known ? 'mastered' : 'review';

  var today = getTodayKey();
  if (!data.daily[today]) data.daily[today] = { count: 0, checked: false };
  data.daily[today].count++;
  saveData();

  if (known) showToast('🎉 太棒了！');
  else showToast('💪 继续加油！');

  currentIndex++;
  if (currentIndex < order.length) {
    showWord();
  } else {
    confetti();
    var mastered = countStatus('mastered');
    showModalMessage('🎊 全部学完啦！', '你已经掌握了 ' + mastered + ' 个单词，真厉害！');
    initLearn();
  }
}

// ==================== 发音 ====================
function speakEnglish() {
  if (order.length === 0) return;
  var w = data.words[order[currentIndex]];
  speak(w.en, 'en-US');
}

function speakChinese() {
  if (order.length === 0) return;
  var w = data.words[order[currentIndex]];
  speak(w.cn, 'zh-CN');
}

function isWeChat() {
  return /MicroMessenger/i.test(navigator.userAgent || '');
}

function pickVoice(lang) {
  var voices = [];
  try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { return null; }
  if (!voices.length) return null;
  var target = lang.toLowerCase().replace('_', '-');
  var prefix = target.slice(0, 2);
  for (var i = 0; i < voices.length; i++) {
    if ((voices[i].lang || '').toLowerCase().replace('_', '-') === target) return voices[i];
  }
  for (var j = 0; j < voices.length; j++) {
    if ((voices[j].lang || '').toLowerCase().indexOf(prefix) === 0) return voices[j];
  }
  return null;
}

function voiceFailTip() {
  if (isWeChat()) {
    showToast('微信里请点右上角…在浏览器打开');
  } else {
    showToast('此设备不支持语音朗读');
  }
}

function speak(text, lang) {
  var ss = window.speechSynthesis;
  if (!ss || typeof SpeechSynthesisUtterance === 'undefined') {
    voiceFailTip();
    return;
  }

  function doSpeak() {
    var started = false;
    try { ss.cancel(); ss.resume(); } catch (e) {}
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = lang.indexOf('en') === 0 ? 0.8 : 0.9;
    u.pitch = 1.1;
    u.volume = 1;
    var v = pickVoice(lang);
    if (v) u.voice = v;
    u.onstart = function () { started = true; };
    u.onerror = function () { if (!started) voiceFailTip(); };
    try {
      ss.speak(u);
    } catch (e) {
      voiceFailTip();
      return;
    }
    // iOS/微信首次可能未真正发声，短暂延迟后重试一次
    setTimeout(function () {
      if (!started && !ss.speaking) {
        try { ss.resume(); ss.speak(new SpeechSynthesisUtterance(text)); } catch (e) {}
      }
    }, 350);
  }

  // 语音列表有时异步加载，等一帧再选语音
  if ((ss.getVoices() || []).length === 0 && 'onvoiceschanged' in ss) {
    var done = false;
    ss.onvoiceschanged = function () {
      if (done) return;
      done = true;
      doSpeak();
    };
    setTimeout(function () { if (!done) { done = true; doSpeak(); } }, 500);
  } else {
    doSpeak();
  }
}

// ==================== 页面切换 ====================
function switchPage(page) {
  var pages = ['learn', 'review', 'checkin'];
  pages.forEach(function(p) {
    document.getElementById('page-' + p).classList.toggle('hidden', p !== page);
  });
  document.querySelectorAll('.nav-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-page') === page);
  });
  if (page === 'review') renderReview();
  if (page === 'checkin') renderCheckin();
  if (page === 'learn') showWord();
}

// ==================== 单词本（复习 / 已掌握） ====================
var reviewTab = 'review';

function switchReviewTab(tab) {
  reviewTab = tab;
  renderReview();
}

function renderReview() {
  var isMastered = reviewTab === 'mastered';
  // "还不会"包含明确标记待复习的、以及还没学过的单词
  var list = data.words.filter(function(w) {
    return isMastered ? data.status[w.en] === 'mastered' : data.status[w.en] !== 'mastered';
  });
  document.getElementById('reviewCount').textContent = list.length + ' 个';
  document.getElementById('tabReview').classList.toggle('active', !isMastered);
  document.getElementById('tabMastered').classList.toggle('active', isMastered);

  var container = document.getElementById('reviewList');
  if (list.length === 0) {
    container.innerHTML = isMastered
      ? '<div class="empty-state"><div class="big-icon">🌱</div><p>还没有学会的单词<br>继续加油！</p></div>'
      : '<div class="empty-state"><div class="big-icon">🎉</div><p>全部都学会啦<br>你真棒！</p></div>';
    return;
  }
  var html = '';
  list.forEach(function(w) {
    html += '<div class="review-item" onclick="playReview(\'' + escapeAttr(w.en) + '\')">' +
      '<div class="review-emoji">' + escapeHtml(w.emoji || '📝') + '</div>' +
      '<div class="review-info"><div class="review-en">' + escapeHtml(w.en) + '</div><div class="review-cn">' + escapeHtml(w.cn) + '</div></div>' +
      '<div class="review-play">🔊</div></div>';
  });
  container.innerHTML = html;
}

function playReview(en) {
  speak(en, 'en-US');
}

function escapeAttr(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ==================== 打卡 ====================
function getTodayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function countStatus(status) {
  var n = 0;
  data.words.forEach(function(w) { if (data.status[w.en] === status) n++; });
  return n;
}

function renderCheckin() {
  var today = getTodayKey();
  var todayData = data.daily[today] || { count: 0, checked: false };
  document.getElementById('todayCount').textContent = '今天 ' + todayData.count + ' 个';
  document.getElementById('statMastered').textContent = countStatus('mastered');
  document.getElementById('statReview').textContent = data.words.length - countStatus('mastered');

  // 连续天数
  var streak = 0;
  var d = new Date();
  while (true) {
    var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if (data.daily[key] && data.daily[key].checked) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  document.getElementById('statStreak').textContent = streak;

  var btn = document.getElementById('checkinBtn');
  if (todayData.checked) {
    btn.textContent = '✅ 今天已打卡';
    btn.classList.add('checked-in');
  } else {
    btn.textContent = '🎯 今日打卡';
    btn.classList.remove('checked-in');
  }

  renderCalendar();
}

function doCheckin() {
  var today = getTodayKey();
  if (!data.daily[today]) data.daily[today] = { count: 0, checked: false };
  if (data.daily[today].checked) {
    showToast('今天已经打过卡啦');
    return;
  }
  data.daily[today].checked = true;
  saveData();
  confetti();
  showToast('🎊 打卡成功！');
  renderCheckin();
}

function renderCalendar() {
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth();
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var today = now.getDate();
  var todayKey = getTodayKey();

  var html = '';
  for (var i = 0; i < firstDay; i++) html += '<div class="calendar-day empty"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var key = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var checked = data.daily[key] && data.daily[key].checked;
    var cls = 'calendar-day' + (checked ? ' checked' : '') + (key === todayKey ? ' today' : '');
    var dot = checked ? '<div class="dot"></div>' : '';
    html += '<div class="' + cls + '">' + d + dot + '</div>';
  }
  document.getElementById('calendarGrid').innerHTML = html;
}

// ==================== 提示消息 ====================
var toastTimer = null;
function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 1500);
}

function confetti() {
  var colors = ['#7FD1A8', '#FFB86C', '#8FC7EE', '#FFB8C6', '#C7B3E5'];
  for (var i = 0; i < 30; i++) {
    (function(i) {
      var el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[i % colors.length];
      el.style.animationDuration = (1.5 + Math.random()) + 's';
      el.style.animationDelay = (Math.random() * 0.5) + 's';
      document.body.appendChild(el);
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
    })(i);
  }
}

function showModalMessage(title, msg) {
  showToast(title + ' ' + msg);
}

// ==================== 配置区 ====================
var configTab = 'simple';

function openConfig() {
  renderEditList();
  document.getElementById('jsonText').value = data.words.map(function(w) {
    return (w.emoji || '') + '|' + w.en + '|' + w.cn;
  }).join('\n');
  document.getElementById('configModal').classList.add('show');
}

function closeConfig() {
  document.getElementById('configModal').classList.remove('show');
}

document.getElementById('configModal').addEventListener('click', function(e) {
  if (e.target === this) closeConfig();
});

function switchTab(tab) {
  configTab = tab;
  document.getElementById('tabSimple').classList.toggle('active', tab === 'simple');
  document.getElementById('tabJson').classList.toggle('active', tab === 'json');
  document.getElementById('configSimple').classList.toggle('hidden', tab !== 'simple');
  document.getElementById('configJson').classList.toggle('hidden', tab !== 'json');
}

function renderEditList() {
  var container = document.getElementById('wordListEdit');
  var html = '';
  data.words.forEach(function(w, i) {
    html += '<div class="edit-row">' +
      '<input class="emoji-in" value="' + escapeAttr(w.emoji || '') + '" data-i="' + i + '" data-f="emoji" maxlength="4">' +
      '<input class="en-in" value="' + escapeAttr(w.en) + '" data-i="' + i + '" data-f="en">' +
      '<input class="cn-in" value="' + escapeAttr(w.cn) + '" data-i="' + i + '" data-f="cn">' +
      '<button onclick="removeWordRow(' + i + ')">✕</button>' +
      '</div>';
  });
  container.innerHTML = html;
}

function addWordRow() {
  data.words.push({ emoji: '📝', en: 'newword', cn: '新单词' });
  renderEditList();
}

function removeWordRow(index) {
  data.words.splice(index, 1);
  renderEditList();
}

function saveSimpleConfig() {
  var inputs = document.querySelectorAll('#wordListEdit input');
  inputs.forEach(function(inp) {
    var i = parseInt(inp.getAttribute('data-i'), 10);
    var f = inp.getAttribute('data-f');
    if (data.words[i] && f) data.words[i][f] = inp.value.trim();
  });
  data.words = data.words.filter(function(w) { return w.en && w.cn; });
  saveData();
  initLearn();
  renderReview();
  showToast('✅ 已保存');
  closeConfig();
}

function saveJsonConfig() {
  var text = document.getElementById('jsonText').value.trim();
  if (!text) { showToast('请输入单词'); return; }
  var lines = text.split('\n');
  var newWords = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var parts = line.split('|');
    if (parts.length < 3) { showToast('第 ' + (i + 1) + ' 行格式不对'); return; }
    newWords.push({ emoji: parts[0].trim(), en: parts[1].trim(), cn: parts[2].trim() });
  }
  if (newWords.length === 0) { showToast('请输入单词'); return; }
  data.words = newWords;
  saveData();
  initLearn();
  renderReview();
  showToast('✅ 已保存 ' + newWords.length + ' 个单词');
  closeConfig();
}

function resetAllData() {
  if (!confirm('确定清空所有学习记录吗？此操作不可恢复。')) return;
  data = { words: JSON.parse(JSON.stringify(DEFAULT_WORDS)), status: {}, daily: {} };
  saveData();
  initLearn();
  renderReview();
  showToast('✅ 已清空');
  closeConfig();
}

// ==================== 启动 ====================
initLearn();
if (isWeChat()) document.getElementById('wechatTip').classList.remove('hidden');
// 微信/iOS 需要用户主动点一下屏幕才允许发声：首次点击时先播一段静音，解锁语音权限
// capture:true 让它先于单词的 onclick 执行，这样第一次点单词就能出声
document.addEventListener('click', function once() {
  if ('speechSynthesis' in window) {
    try {
      var u = new SpeechSynthesisUtterance('');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    } catch(e) {}
  }
}, { once: true, capture: true });
</script>
